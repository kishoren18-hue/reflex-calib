[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "reflex-calib"
version = "0.1.0"
description = "Calibrated slip prediction from magnetic tactile skins under sensor shift"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10", "scikit-learn>=1.3",
                "matplotlib>=3.7", "huggingface_hub>=0.20"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
packages = ["reflex_calib"]
